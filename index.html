<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14231d" />
    <link rel="icon" type="image/png" href="/assets/logo/ib-monogram-avatar.png" />
    <link rel="apple-touch-icon" href="/assets/logo/ib-monogram-avatar.png" />
    <title>Intent Bureau | Digital Product & AI Studio</title>
    <meta name="description" content="Intent Bureau designs and builds web and mobile apps, AI and voice agents, immersive 3D experiences, and the cloud infrastructure to keep them running." />
    <meta property="og:title" content="Intent Bureau | Digital Product & AI Studio" />
    <meta property="og:description" content="Web and mobile apps, AI and voice agents, immersive 3D, and hosting — designed and built in one connected studio." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#f3f3ec] text-[#15201b] antialiased">
    <form
      name="discovery-call"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      aria-hidden="true"
      style="position:absolute;left:-100vw;top:auto;width:1px;height:1px;overflow:hidden"
    >
      <input type="hidden" name="form-name" value="discovery-call" />
      <p><label>Leave this field empty: <input name="bot-field" /></label></p>
      <label>Your name <input name="name" /></label>
      <label>Work email <input type="email" name="email" /></label>
      <label>Company or project <input name="business" /></label>
      <label>What would you like to build? <textarea name="message"></textarea></label>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
